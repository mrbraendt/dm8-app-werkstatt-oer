<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, -apple-system, sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); box-sizing: border-box; }
    .msg { display: grid; place-items: center; height: 100%; text-align: center; padding: 24px; color: #475569; font-size: 1.1rem; }
    .msg b { display: block; font-size: 3rem; margin-bottom: 8px; }
    .menu { display: grid; gap: 10px; width: min(420px, 100%); }
    .menu h1 { margin: 0 0 6px; font-size: 1.4rem; color: #1f2937; }
    .menu a { display: block; padding: 14px; border-radius: 14px; background: #5b4bdb; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="msg" id="msg"><div><b>📱</b>App wird geladen …</div></div>
  <script>
  (async () => {
    const [, , token, appId] = location.pathname.split("/");
    const msg = document.getElementById("msg");
    const fail = t => { msg.innerHTML = `<div><b>🙈</b>${t}</div>`; };
    if (!token) return fail("Diese Adresse ist unvollständig.");
    if (!appId) {
      try {
        const r = await fetch(`/api/shared/${encodeURIComponent(token)}`), j = await r.json().catch(() => ({}));
        if (!r.ok) return fail(j.error || "Nicht gefunden.");
        document.title = "Meine Apps";
        msg.innerHTML = `<div class="menu"><b>📱</b><h1>Welche App?</h1>${j.apps.map(a => `<a href="/a/${token}/${a.id}">${a.titel.replace(/[<&>"]/g, "")}</a>`).join("") || "<p>Noch keine Apps gebaut.</p>"}</div>`;
      } catch (e) { fail("Keine Verbindung. Ist das Internet da?"); }
      return;
    }
    let app;
    try {
      const r = await fetch(`/api/shared/${encodeURIComponent(token)}/${encodeURIComponent(appId)}`);
      const j = await r.json().catch(() => ({}));
      if (!r.ok) return fail(j.error || "Die App konnte nicht geladen werden.");
      app = j.app;
    } catch (e) { return fail("Keine Verbindung. Ist das Internet da?"); }
    document.title = (app.screen && app.screen.titel) || "App";

    // Speicher-Brücke: Die App läuft abgeschottet (ohne Zugriff auf diese Seite).
    // Was sie speichert, landet über postMessage im Speicher dieses Geräts.
    const pre = `appw-${token}-${appId}-`, snap = {};
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(pre)) snap[k.slice(pre.length)] = localStorage.getItem(k); } } catch (e) {}
    const frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-scripts");
    frame.title = document.title;
    window.addEventListener("message", e => {
      if (e.source !== frame.contentWindow || !e.data || e.data.ww !== "set") return;
      const k = String(e.data.k).slice(0, 60), v = String(e.data.v).slice(0, 20000);
      try { localStorage.setItem(pre + k, v); } catch (err) {}
    });
    const data = JSON.stringify({ app, snap }).replace(/</g, "\\u003c");
    const boot = `const D=${data};const mem=D.snap;
      WW.run(document.body,D.app,D.app.code||"",{key:"teilen",store:{get:k=>mem[k]??null,set:(k,v)=>{mem[k]=v;parent.postMessage({ww:"set",k,v},"*")}}});`;
    frame.srcdoc = `<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><script src="${location.origin}/runtime.js?v=1"><\/script><script>${boot}<\/script></body></html>`;
    msg.remove();
    document.body.appendChild(frame);
  })();
  </script>
</body>
</html>
