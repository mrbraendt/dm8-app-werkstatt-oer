<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>App-Werkstatt</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <div id="login" class="login">
    <div class="login-card">
      <div class="login-logo">📱</div>
      <h1>App-Werkstatt</h1>
      <p class="muted">Hier baust du deine eigenen Apps – mit Blöcken, ganz ohne Vorkenntnisse.</p>
      <div class="mode" role="tablist">
        <button type="button" id="m-new" class="on">🆕 Ich bin neu</button>
        <button type="button" id="m-old">🔑 Ich habe schon ein Konto</button>
      </div>
      <form id="login-form" autocomplete="off">
        <label>Klasse <input id="l-kurs" required placeholder="z. B. 8d"></label>
        <label>Vorname <input id="l-nick" required maxlength="20" placeholder="z. B. Lena"></label>
        <label><span id="l-pin-lbl">Denk dir eine PIN aus (4 Ziffern)</span> <input id="l-pin" required inputmode="numeric" pattern="\d{4}" maxlength="4" type="password" placeholder="••••"></label>
        <label id="l-pin2-wrap">PIN noch einmal <input id="l-pin2" inputmode="numeric" pattern="\d{4}" maxlength="4" type="password" placeholder="••••"></label>
        <button type="submit" class="btn primary" id="l-go">Konto anlegen</button>
        <p class="login-msg" id="l-msg" role="alert"></p>
      </form>
      <div class="login-hint">✍️ Trag deinen <b>Vornamen</b> ein – gibt es ihn in deiner Klasse schon, hänge den ersten Buchstaben deines Nachnamens an (z. B. „Lena M.“).<br>🔒 Merk dir deine <b>PIN</b> gut.</div>
    </div>
  </div>

  <div id="app" hidden>
    <header class="bar">
      <div class="namebadge" id="me-name"></div>
      <div class="st-nav">
        <button class="icon-btn" id="st-prev" title="Vorherige Station">‹</button>
        <button class="st-pick" id="st-pick" title="Alle Stationen anzeigen"></button>
        <button class="icon-btn" id="st-next" title="Nächste Station">›</button>
      </div>
      <nav class="views">
        <button id="v-note" title="So wirst du bewertet">🎓 Meine Note</button>
        <button id="v-lex" title="Alle Blöcke erklärt">🧩 Block-Lexikon</button>
        <button id="v-tour" title="Die Werkstatt noch einmal erklärt bekommen">🧭 Tour</button>
      </nav>
      <div class="me">
        <span class="save" id="save-state"></span>
        <button class="btn small" id="logout">Abmelden</button>
      </div>
    </header>

    <div class="split app" id="split">
      <section class="learn" id="learn"></section>
      <section class="work app">
        <div class="wk-main">
          <div class="wk-tabs">
            <button data-tab="design" class="on">🎨 Oberfläche</button>
            <button data-tab="blocks">🧩 Blöcke</button>
            <span class="appname" id="appname"></span>
          </div>
          <div class="wk-pane">
            <div class="designer" id="designer"></div>
            <div id="blockly" hidden></div>
          </div>
          <button class="detective app" id="detective"></button>
          <div class="detective-list" id="detective-list" hidden></div>
        </div>
        <div class="phone-col">
          <div class="phone"><iframe id="preview" title="So sieht deine App aus" sandbox="allow-scripts"></iframe></div>
          <div class="phone-tools">
            <button id="t-restart" title="App neu starten">↻ Neu starten</button>
            <button id="t-share" title="App auf dem iPad testen">📱 Auf dem iPad</button>
            <button id="t-versions" title="Ältere Versionen">🕘</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <dialog id="dlg"><div id="dlg-body"></div></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script src="vendor/blockly/blockly_compressed.js"></script>
  <script src="vendor/blockly/blocks_compressed.js"></script>
  <script src="vendor/blockly/javascript_compressed.js"></script>
  <script src="vendor/blockly/de.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="runtime.js?v=1"></script>
  <script src="blocks.js?v=1"></script>
  <script src="checks.js?v=1"></script>
  <script src="stations.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
